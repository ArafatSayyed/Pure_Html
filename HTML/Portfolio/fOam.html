<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foam</title>
</head>
<body>
    <form action="/action.php">
        <center>
            <h1>Registration Form</h1>
        </center>
        <hr>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/XiIEffeacAk?si=8e88jRnqK_oIzrMS" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <hr>
        <input type="text" placeholder="Enter your name">
        <br>
        <br>
        <input type="password" placeholder="Enter your password">
        <hr>
        <br>
        <h1>Radio Button with label</h1>   
        <label for="101">
            <input type="radio" name="gender" id="101" value="Male" checked> Male
        </label>
        <label for="102">
            <input type="radio" name="gender" id="102" value="Female"> Female
        </label>
        <hr>
        <h1>Check Box with label</h1>
        <label for="maths">
            <input type="checkbox" name="subjects" id="maths"> Maths
        </label>
        <label for="phy">
            <input type="checkbox" name="subjects" id="phy"> Physics
        </label>
        <label for="chem">
            <input type="checkbox" name="subjects" id="chem"> Chemistry
        </label>
        <label for="bio">
            <input type="checkbox" name="subjects" id="bio"> Biology
        </label>
        <hr>
        <h1>Dropdown List</h1>
        <select name="country">
            <option value="usa">United States</option>
            <option value="canada">Canada</option>
            <option value="uk">United Kingdom</option>
        </select>
        <hr>
        <h1>Text Area for Feedback</h1>
        <textarea name="feedback" rows="4" cols="50" placeholder="Enter your feedback here..."></textarea>
        <hr>
        <h1>Submit Button</h1>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
