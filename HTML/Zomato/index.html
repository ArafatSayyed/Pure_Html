<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zomato - Discover the Best Food</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header>

        <div class="logo">
            <img src="logo.webp" alt="Zomato Logo">
        </div>

        <nav>
            <ul>
                <li>
                    <a href="https://www.eternal.com/investor-relations/">
                        Investor Relations
                    </a>
                </li>

                <li>
                    <a href="https://www.zomato.com/partner-with-us/new/">
                        Add restaurant
                    </a>
                </li>

                <li>
                    <a href="https://www.zomato.com/login">
                        Log in
                    </a>
                </li>

                <li>
                    <a href="https://www.zomato.com/signup">
                        Sign up
                    </a>
                </li>
            </ul>
        </nav>

    </header>


    <!-- Main Hero Section -->
    <main>

        <div class="hero-content">

            <!-- Main Zomato Logo -->
            <img
                src="logo.webp"
                alt="Zomato"
                class="main-logo"
            >

            <!-- Main Heading -->
            <h1>
                Find the best restaurants, cafés
                <br>
                and bars in India
            </h1>

            <!-- Search Box -->
            <div class="search-container">

                <span class="location-icon">📍</span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search for restaurant, cuisine or a dish"
                    autocomplete="off"
                >

                <button id="searchButton">
                    Search
                </button>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer>
        <p>
            Copyright &copy; Zomato | All rights reserved
        </p>
    </footer>


    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
